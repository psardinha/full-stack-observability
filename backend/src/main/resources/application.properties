# Service A - String Reversal Service
quarkus.http.port=8080
quarkus.rest-client.service_uri.url=http://localhost:${quarkus.http.port}
quarkus.observability.lgtm.enabled=true

message=...with or without clouds

# Swagger UI in production
quarkus.swagger-ui.always-include=true

# OpenTelemetry Configuration
quarkus.otel.service.name=string-tests
quarkus.otel.traces.sampler=always_on
app.environment=${ENVIRONMENT:local}
%dev.app.environment=development
quarkus.otel.resource.attributes=deployment=${app.environment},service.version=${quarkus.application.version}

#quarkus.otel.metrics.exporter=otlp
#quarkus.otel.metrics.exporter=cdi

quarkus.otel.metrics.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.propagators=tracecontext,baggage
# Do not create spans for OTLP proxy ingress endpoints
quarkus.otel.traces.suppress-application-uris=/otel/v1/traces,/otel/v1/metrics,/otel/v1/logs
# Export everything (traces, metrics, logs) via gRPC to LGTM DevServices
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=grpc

#quarkus.observability.lgtm.otlp-protocol=grpc
quarkus.observability.lgtm.otel-grpc-port=4317

quarkus.observability.lgtm.otel-http-port=4318
# HTTP OTLP collector endpoint used by /otel/v1 proxy endpoints
otel.proxy.collector.url=${OTEL_PROXY_COLLECTOR_URL:http://localhost:4318}
# Keep OTEL forwarding thread usage significantly below /utils traffic handling.
otel.proxy.max-threads=2
quarkus.observability.lgtm.grafana-port=3000

# Log correlation with traceId/spanId and application version
quarkus.log.console.format=%d{HH:mm:ss} %-5p environment=${app.environment}, serviceVersion=${quarkus.application.version:unknown}, traceId=%X{traceId}, spanId=%X{spanId} [%c{2.}] %s%e%n

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4201}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=content-type,content-encoding,accept,origin,authorization,traceparent,tracestate,baggage
quarkus.http.cors.access-control-max-age=24H

quarkus.test.continuous-testing=disabled